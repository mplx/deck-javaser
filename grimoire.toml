# Grimoire book configuration for the @mplx/javaser documentation.

[book]
title = "@mplx/javaser"
description = "Decode Java Object Serialization streams (.ser files, ObjectOutputStream output) into a navigable object graph, without running any Java code"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://mplx.github.io/deck-javaser/"
repoUrl = "https://github.com/mplx/deck-javaser"
repoLabel = "Source"
editUrl = "https://github.com/mplx/deck-javaser/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
